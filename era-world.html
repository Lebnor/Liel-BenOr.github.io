<!doctype html>
<html lang="en">

<script type="module">
import * as THREE from 'three';
import { Text, preloadFont } from 'troika-three-text';

const PORTRAIT_SRC = '/static/img/me.png';
const PROJECTS = [
  { src: '/static/img/projects/popsi-colada.png',                title: 'Popsi Colada',   meta: 'DJANGO · REST · 2021',   z: -155, side: -1, y:  6 },
  { src: '/static/img/projects/network.png',                     title: 'Network',        meta: 'PRODUCT STATE · 2021',  z: -210, side:  1, y: -5 },
  { src: '/static/img/projects/angular-file-generator-main.png',  title: 'File Generator', meta: 'ANGULAR · AWS · 2022',  z: -265, side: -1, y: -7 },
  { src: '/static/img/projects/fractals-main.png',               title: 'Fractals',       meta: 'RECURSION · 2022',      z: -320, side:  1, y:  7 },
];

const DIFF = [
  ['BUILDING', 'Make it work.', 'Make the system understandable, operable, and worth maintaining.'],
  ['LEARNING', 'Collect technologies.', 'Choose fewer tools, for clearer reasons.'],
  ['CRAFT', 'Add another effect.', 'Make every interaction explain itself.'],
];

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SMALL = Math.min(innerWidth, innerHeight) < 620;
const DPR = Math.min(devicePixelRatio || 1, SMALL ? 1.5 : 2);
const QUALITY = SMALL ? 0.5 : 1;

const WARM = 0xfff1e4, ACCENT = 0xff6a3d, DIM = 0x6e6a66;
const Z_START = 85, Z_END = -482, SPAN = Z_START - Z_END;

/* ============================================================================
   THE FLIGHT PATH
   One continuous route through the world. Everything is positioned relative to
   it, so the camera genuinely translates hundreds of units and depth produces
   real parallax instead of a drift too small to see.
   ========================================================================== */
function pathAt(z, out = new THREE.Vector3()) {
  const t = (Z_START - z) / SPAN;
  return out.set(
    Math.sin(t * Math.PI * 2.6) * 17,
    Math.cos(t * Math.PI * 1.9) * 9.5,
    z
  );
}

/* ============================================================================
   THE 2022 PAGE
   ========================================================================== */
const PAGE_W = 1600, PAGE_H = 900;

function drawArchivePage(portrait) {
  const c = document.createElement('canvas');
  c.width = PAGE_W; c.height = PAGE_H;
  const x = c.getContext('2d', { willReadFrequently: true });
  const BLUE = '#2196f3';

  x.fillStyle = '#ffffff'; x.fillRect(0, 0, PAGE_W, PAGE_H);
  x.fillStyle = BLUE;
  x.beginPath(); x.arc(112, 84, 26, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#fff'; x.font = '700 17px Arial'; x.textAlign = 'center';
  x.fillText('LB', 112, 90);
  x.textAlign = 'left'; x.fillStyle = '#2d2d2d'; x.font = '700 15px Arial';
  let nx = 980;
  for (const item of ['HOME', 'MY SKILLS', 'ABOUT ME', 'MY PROJECTS']) {
    x.fillText(item, nx, 90); nx += x.measureText(item).width + 46;
  }
  x.fillStyle = '#2d2d2d';
  x.font = '400 78px Arial';  x.fillText('Hi, I am', 112, 360);
  x.font = '700 150px Arial'; x.fillText('Liel', 112, 490);
                              x.fillText('Ben-Or', 112, 620);
  x.fillStyle = BLUE; x.fillRect(112, 664, 372, 56);
  x.fillStyle = '#fff'; x.font = '700 26px Arial';
  x.fillText('full-stack developer', 132, 702);

  const pd = 360, px = 1080, py = 250;
  x.fillStyle = BLUE; x.fillRect(px + 66, py + 44, pd, pd);
  x.save();
  x.beginPath(); x.arc(px + pd / 2, py + pd / 2, pd / 2, 0, Math.PI * 2); x.clip();
  x.filter = 'grayscale(1) contrast(1.05)';
  x.drawImage(portrait, px, py, pd, pd);
  x.restore(); x.filter = 'none';

  x.strokeStyle = '#d8d8d8'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(112, 800); x.lineTo(PAGE_W - 112, 800); x.stroke();
  x.fillStyle = '#6a6a6a'; x.font = '400 21px Arial';
  x.fillText('Student and self-taught developer', 112, 840);
  x.textAlign = 'right'; x.fillText('Nice to meet you!', PAGE_W - 112, 840);

  const pcv = document.createElement('canvas');
  pcv.width = pcv.height = pd;
  const pcx = pcv.getContext('2d', { willReadFrequently: true });
  pcx.drawImage(portrait, 0, 0, pd, pd);

  return {
    canvas: c, ctx: x,
    circle: { cx: px + pd / 2, cy: py + pd / 2, r: pd / 2 },
    portraitData: pcx.getImageData(0, 0, pd, pd).data,
    portraitSize: pd,
  };
}

/* ============================================================================
   GLSL
   ========================================================================== */
const NOISE = `
  float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453123); }
  float hash3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453123); }
  float noise2(vec2 p){
    vec2 i = floor(p), f = fract(p);
    float a = hash(i), b = hash(i+vec2(1,0)), c = hash(i+vec2(0,1)), d = hash(i+vec2(1,1));
    vec2 u = f*f*(3.0-2.0*f);
    return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
  }
  float noise3(vec3 p){
    vec3 i = floor(p), f = fract(p);
    vec3 u = f*f*(3.0-2.0*f);
    float n000=hash3(i), n100=hash3(i+vec3(1,0,0)), n010=hash3(i+vec3(0,1,0)), n110=hash3(i+vec3(1,1,0));
    float n001=hash3(i+vec3(0,0,1)), n101=hash3(i+vec3(1,0,1)), n011=hash3(i+vec3(0,1,1)), n111=hash3(i+vec3(1,1,1));
    return mix(mix(mix(n000,n100,u.x), mix(n010,n110,u.x), u.y),
               mix(mix(n001,n101,u.x), mix(n011,n111,u.x), u.y), u.z);
  }
`;

/* Particles live in world space. uMorph is driven by how far the camera has
   pushed past the page, so the shatter happens because you flew through it. */
const POINTS_VERT = `
  uniform float uTime, uMorph, uSize, uDpr;
  uniform vec3  uCam;
  attribute vec3  aTarget;
  attribute vec3  aColor;
  attribute float aRand;
  attribute float aKeep;
  attribute float aWeight;
  varying vec3  vColor;
  varying float vAlpha;
  ${NOISE}

  void main() {
    float m = uMorph;
    float burst  = exp(-pow((m - 0.38) / 0.19, 2.0));
    float settle = smoothstep(0.22, 0.88, m);

    vec3 pos = mix(position, aTarget, settle);

    vec3 seed = position * 0.06 + uTime * 0.05;
    vec3 dir = normalize(vec3(
      noise3(seed) - 0.5, noise3(seed.yzx + 11.3) - 0.5, noise3(seed.zxy + 27.1) - 0.5
    ) + 1e-5);
    float scatter = mix(26.0, 7.0, aKeep);
    pos += dir * burst * scatter * (0.5 + aRand);
    pos += dir * (1.0 - aKeep) * settle * (30.0 + aRand * 46.0);

    // debris shoves aside as the camera reaches it — you are moving it, not watching it
    vec3 away = pos - uCam;
    float near = smoothstep(34.0, 4.0, length(away));
    pos += normalize(away + 1e-5) * near * 13.0;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = uSize * uDpr * (0.6 + aRand * 0.8) * (150.0 / max(1.0, -mv.z));

    vec3 warm = mix(vec3(1.0, 0.93, 0.84), vec3(1.0, 0.46, 0.20), aRand * 0.6);
    vColor = mix(pow(aColor, vec3(2.2)), pow(warm, vec3(2.2)) * (0.12 + aWeight * 1.75), settle * 0.92);
    float fade = mix(1.0, aKeep * (0.10 + aWeight * 1.3), settle);
    vAlpha = fade * (0.25 + burst * 0.5 + settle * 0.75) * smoothstep(0.0, 0.06, m);
  }
`;

const POINTS_FRAG = `
  precision highp float;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = dot(uv, uv);
    if (d > 0.25) discard;
    gl_FragColor = vec4(vColor, smoothstep(0.25, 0.01, d) * vAlpha);
  }
`;

/* A single atmospheric pass over the one rendered world. Not a scene blender —
   grain, vignette and a speed-driven chromatic smear. */
const POST_FRAG = `
  precision highp float;
  uniform sampler2D tScene;
  uniform float uTime, uSpeed, uShatter;
  varying vec2 vUv;
  ${NOISE}
  void main() {
    vec2 c = vUv - 0.5;
    float r = length(c);
    float amt = (uSpeed * 0.010 + uShatter * 0.020) * smoothstep(0.05, 0.75, r);

    vec3 col;
    col.r = texture2D(tScene, vUv + c * amt * 1.6).r;
    col.g = texture2D(tScene, vUv).g;
    col.b = texture2D(tScene, vUv - c * amt * 1.6).b;

    col *= 1.0 - r * r * 0.55;                       // vignette
    col += (hash(vUv + uTime) - 0.5) * (0.020 + uShatter * 0.05);
    gl_FragColor = vec4(col, 1.0);
  }
`;

const POST_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const PAGE_VERT = `
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;

/* The erosion, kept — but as a property of the page itself rather than a
   screen-space blend between two scenes. The hole opens where the camera is
   headed and spreads outward, so the page burns away because you flew into it.
   Everything violent still lives in the narrow band at the moving edge. */
const PAGE_FRAG = `
  precision highp float;
  uniform sampler2D tPage;
  uniform float uTime, uErode;
  varying vec2 vUv;
  ${NOISE}

  void main() {
    float m = noise2(vUv * vec2(5.2, 3.1) + uTime * 0.03) * 0.34
            + length(vUv - 0.5) * 1.45 * 0.66;

    float th   = uErode * 1.5 - 0.10;
    float keep = smoothstep(th - 0.09, th + 0.09, m);
    if (keep < 0.004) discard;
    float band = 1.0 - abs(keep - 0.5) * 2.0;

    float n = smoothstep(0.32, 0.72,
        noise2(vec2(vUv.x *  60.0, uTime * 0.3)) * 0.5
      + noise2(vec2(vUv.x * 220.0, uTime * 0.5)) * 0.5);
    float f = band * n;

    vec2 uv = vUv;
    uv.y = (uv.y - 0.5) * exp(-f * 0.85) + 0.5;
    uv.x += sin(vUv.y * 70.0 + uTime * 3.0) * f * 0.006;
    vec2 split = vec2(f * 0.030, f * 0.008);

    vec3 col;
    col.r = texture2D(tPage, clamp(uv + split, 0.0, 1.0)).r;
    col.g = texture2D(tPage, clamp(uv,         0.0, 1.0)).g;
    col.b = texture2D(tPage, clamp(uv - split, 0.0, 1.0)).b;

    col *= 1.0 - 0.58 * band;                                     // burn, never bloom
    col += vec3(1.0, 0.42, 0.16) * smoothstep(0.68, 1.0, band) * 0.95;
    col += (hash(vUv + uTime) - 0.5) * (0.016 + band * 0.09);

    gl_FragColor = vec4(col, keep);
  }
`;

/* ============================================================================
   WORLD
   ========================================================================== */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#08080a');
scene.fog = new THREE.FogExp2(0x08080a, 0.0075);

const camera = new THREE.PerspectiveCamera(58, 1, 0.5, 700);
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.UnsignedByteType, colorSpace: THREE.SRGBColorSpace });

const postScene = new THREE.Scene();
const postCam = new THREE.Camera();
const postMat = new THREE.ShaderMaterial({
  vertexShader: POST_VERT, fragmentShader: POST_FRAG, depthTest: false, depthWrite: false,
  uniforms: {
    tScene: { value: rt.texture }, uTime: { value: 0 }, uSpeed: { value: 0 }, uShatter: { value: 0 },
  },
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

let pointsMat = null, pagePlane = null;
const PORTRAIT_Z = -68;

function makeText(txt, o = {}) {
  const t = new Text();
  t.text = txt;
  t.fontSize = o.size ?? 2;
  t.color = o.color ?? WARM;
  t.anchorX = o.anchorX ?? 'center';
  t.anchorY = o.anchorY ?? 'middle';
  if (o.maxWidth) t.maxWidth = o.maxWidth;
  if (o.letterSpacing) t.letterSpacing = o.letterSpacing;
  if (o.lineHeight) t.lineHeight = o.lineHeight;
  t.material.toneMapped = false;
  t.material.depthWrite = false;
  t.sync();
  return t;
}

/** Places an object at a world point offset from the flight path at that depth. */
function place(obj, z, dx = 0, dy = 0) {
  const anchor = pathAt(z);
  obj.position.set(anchor.x + dx, anchor.y + dy, z);
  scene.add(obj);
  return obj;
}

function buildPage(portraitImg) {
  const { canvas: pageCanvas, ctx, circle, portraitData, portraitSize } = drawArchivePage(portraitImg);

  const PW = 108, PH = PW * PAGE_H / PAGE_W;
  const tex = new THREE.CanvasTexture(pageCanvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  pagePlane = new THREE.Mesh(
    new THREE.PlaneGeometry(PW, PH),
    new THREE.ShaderMaterial({
      vertexShader: PAGE_VERT, fragmentShader: PAGE_FRAG,
      transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
      uniforms: { tPage: { value: tex }, uTime: { value: 0 }, uErode: { value: 0 } },
    })
  );
  place(pagePlane, 0);

  // ---- particles: page arrangement -> portrait, both in world space ----
  const img = ctx.getImageData(0, 0, PAGE_W, PAGE_H).data;
  const { cx, cy, r: pr } = circle;
  const PS = portraitSize, px0 = cx - pr, py0 = cy - pr;
  const pageAt = pagePlane.position, portAt = pathAt(PORTRAIT_Z);

  const CAP = 200000;
  const pos = new Float32Array(CAP * 3), tgt = new Float32Array(CAP * 3), col = new Float32Array(CAP * 3);
  const rnd = new Float32Array(CAP), keep = new Float32Array(CAP), wgt = new Float32Array(CAP);
  let k = 0;

  const wx = (sx) => pageAt.x + (sx / PAGE_W - 0.5) * PW;
  const wy = (sy) => pageAt.y - (sy / PAGE_H - 0.5) * PH;

  const wallLum = (() => {
    const ring = [];
    for (let a = 0; a < 360; a += 2) {
      const lx = Math.floor(PS / 2 + Math.cos(a * Math.PI / 180) * (PS / 2) * 0.94);
      const ly = Math.floor(PS / 2 + Math.sin(a * Math.PI / 180) * (PS / 2) * 0.94);
      const o = (ly * PS + lx) * 4;
      ring.push((0.299 * portraitData[o] + 0.587 * portraitData[o + 1] + 0.114 * portraitData[o + 2]) / 255);
    }
    ring.sort((a, b) => a - b);
    return ring[Math.floor(ring.length * 0.5)];
  })();

  function subjectAt(sx, sy) {
    const lx = Math.floor((sx - px0) / (2 * pr) * PS), ly = Math.floor((sy - py0) / (2 * pr) * PS);
    if (lx < 0 || ly < 0 || lx >= PS || ly >= PS) return null;
    const o = (ly * PS + lx) * 4;
    const r = portraitData[o] / 255, g = portraitData[o + 1] / 255, b = portraitData[o + 2] / 255;
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    const chroma = Math.max(r, g, b) - Math.min(r, g, b);
    return (chroma > 0.055 || lum < wallLum - 0.10) ? { r, g, b, lum } : null;
  }

  function write(sx, sy, r, g, b, target, isKeep, weight) {
    const i3 = k * 3;
    pos[i3] = wx(sx); pos[i3 + 1] = wy(sy); pos[i3 + 2] = pageAt.z;
    col[i3] = r; col[i3 + 1] = g; col[i3 + 2] = b;
    tgt[i3] = target[0]; tgt[i3 + 1] = target[1]; tgt[i3 + 2] = target[2];
    keep[k] = isKeep; wgt[k] = weight; rnd[k] = Math.random();
    k++;
  }

  const COLS = Math.round(540 * QUALITY), ROWS = Math.round(COLS * PAGE_H / PAGE_W);
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const sx = (i + 0.5) * PAGE_W / COLS, sy = (j + 0.5) * PAGE_H / ROWS;
      if (Math.hypot(sx - cx, sy - cy) < pr) continue;
      const o = (Math.floor(sy) * PAGE_W + Math.floor(sx)) * 4;
      const r = img[o] / 255, g = img[o + 1] / 255, b = img[o + 2] / 255;
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      if (lum > 0.92) continue;
      write(sx, sy, r, g, b, [wx(sx) * 1.6, wy(sy) * 1.6, pageAt.z - 30], 0, 1 - lum);
    }
  }

  const PN = Math.round(230 * Math.max(0.8, QUALITY));
  const samples = [];
  for (let j = 0; j < PN; j++) {
    for (let i = 0; i < PN; i++) {
      const sx = px0 + (i + 0.5) * (2 * pr) / PN, sy = py0 + (j + 0.5) * (2 * pr) / PN;
      if (Math.hypot(sx - cx, sy - cy) >= pr) continue;
      const s = subjectAt(sx, sy);
      if (s) samples.push({ sx, sy, ...s });
    }
  }
  const sorted = samples.map(s => s.lum).sort((a, b) => a - b);
  const lo = sorted[Math.floor(sorted.length * 0.04)], hi = sorted[Math.floor(sorted.length * 0.97)];
  const tone = (l) => Math.pow(Math.min(1, Math.max(0, (l - lo) / (hi - lo))), 1.55);

  for (const s of samples) {
    const nx = (s.sx - cx) / pr, ny = (s.sy - cy) / pr, t = tone(s.lum);
    write(s.sx, s.sy, s.r, s.g, s.b,
      [portAt.x + nx * 17, portAt.y - ny * 17, PORTRAIT_Z + (t - 0.42) * 12], 1, 0.05 + 0.95 * t);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos.slice(0, k * 3), 3));
  geo.setAttribute('aTarget',  new THREE.BufferAttribute(tgt.slice(0, k * 3), 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col.slice(0, k * 3), 3));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(rnd.slice(0, k), 1));
  geo.setAttribute('aKeep',    new THREE.BufferAttribute(keep.slice(0, k), 1));
  geo.setAttribute('aWeight',  new THREE.BufferAttribute(wgt.slice(0, k), 1));

  pointsMat = new THREE.ShaderMaterial({
    vertexShader: POINTS_VERT, fragmentShader: POINTS_FRAG,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: {
      uTime: { value: 0 }, uMorph: { value: 0 }, uSize: { value: 2.3 },
      uDpr: { value: DPR }, uCam: { value: new THREE.Vector3() },
    },
  });
  const points = new THREE.Points(geo, pointsMat);
  points.frustumCulled = false;
  scene.add(points);

  const caption = makeText('Preserved, not inflated.', { size: 2.6 });
  place(caption, PORTRAIT_Z, 0, -23);
  const mark = makeText('LIEL BEN-OR', { size: 0.9, color: ACCENT, letterSpacing: 0.34 });
  place(mark, PORTRAIT_Z, 0, -27);

  console.info(`[world] ${k.toLocaleString()} particles`);
}

function buildProjects(textures) {
  const heading = makeText('Things I built.', { size: 3.4 });
  place(heading, -120, 0, 14);

  PROJECTS.forEach((proj) => {
    const tex = textures[proj.src];
    const imgAspect = tex.image.width / tex.image.height;
    let w = 34, h = w / imgAspect;
    if (h > 26) { h = 26; w = h * imgAspect; }

    const group = new THREE.Group();
    const card = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })
    );
    const frame = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)),
      new THREE.LineBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.4 })
    );
    const title = makeText(proj.title, { size: 2.0, anchorX: 'left' });
    title.position.set(-w / 2, -h / 2 - 2.6, 0.2);
    const meta = makeText(proj.meta, { size: 1.0, color: DIM, letterSpacing: 0.22, anchorX: 'left' });
    meta.position.set(-w / 2, -h / 2 - 5.0, 0.2);

    group.add(card, frame, title, meta);
    group.rotation.y = proj.side * -0.42;          // angled into the flight line
    place(group, proj.z, proj.side * 26, proj.y);
  });
}

function buildDiff() {
  const head = makeText('Same person.\nDifferent definition of done.', { size: 3.0, lineHeight: 1.25 });
  place(head, -362, 0, 13);

  // Each row is a panel set beside the route and angled back toward it, the way
  // the project cards are. Text sitting on the path itself is text you fly
  // through, and glyphs at two metres are not readable.
  const BLOCK = 36;
  DIFF.forEach(([label, before, after], i) => {
    const z = -392 - i * 38;
    const side = i % 2 === 0 ? -1 : 1;
    const group = new THREE.Group();

    const lab = makeText(label, { size: 0.9, color: ACCENT, letterSpacing: 0.3, anchorX: 'left' });
    lab.position.set(0, 5.6, 0);
    const bef = makeText('−  ' + before, { size: 1.4, color: DIM, anchorX: 'left' });
    bef.position.set(0, 2.8, 0);
    const aft = makeText('+  ' + after, { size: 1.8, anchorX: 'left', maxWidth: BLOCK, lineHeight: 1.3 });
    aft.position.set(0, -0.6, 0);

    group.add(lab, bef, aft);
    group.rotation.y = side * -0.5;
    // the text is left-anchored, so the whole block has to clear the route in the
    // direction it grows — otherwise it reaches back across and you fly into it
    place(group, z, side < 0 ? -(BLOCK + 22) : 22, 0);
  });
}

function buildEnd() {
  const head = makeText('Let’s build something.', { size: 5.0, maxWidth: 42, lineHeight: 1.2 });
  place(head, -520, 0, 6);
  const mail = makeText('liel4349@gmail.com', { size: 2.4, color: ACCENT });
  place(mail, -520, 0, -6);
  const links = makeText('GITHUB    LINKEDIN    RESUME', { size: 1.1, color: DIM, letterSpacing: 0.32 });
  place(links, -520, 0, -13);
}

/* ============================================================================
   FLIGHT
   ========================================================================== */
let targetP = 0, smoothP = 0, prevZ = Z_START;
function readScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  targetP = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}
addEventListener('scroll', readScroll, { passive: true });
window.__spike = { set(v) { targetP = smoothP = v; } };

const look = new THREE.Vector2(0, 0), lookTarget = new THREE.Vector2(0, 0);
addEventListener('pointermove', (e) => {
  lookTarget.set(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
}, { passive: true });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  rt.setSize(Math.round(w * DPR), Math.round(h * DPR));
  camera.aspect = w / h;
  camera.fov = w / h < 0.9 ? 74 : 58;          // wider lens so a phone still sees the world
  camera.updateProjectionMatrix();
  readScroll();
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
const readout = document.getElementById('readout');
const placeEl = document.getElementById('place');
const hint = document.getElementById('hint');
const camPos = new THREE.Vector3(), aheadPos = new THREE.Vector3();

function placeName(z) {
  if (z > -34) return '2022';
  if (z > -95) return '2026';
  if (z > -346) return 'WORK';
  if (z > -465) return 'DIFF';
  return 'NEXT';
}

function frame() {
  requestAnimationFrame(frame);
  const t = clock.getElapsedTime();

  smoothP += (targetP - smoothP) * (reduced ? 1 : 0.075);
  const z = Z_START - smoothP * SPAN;
  const speed = Math.min(1, Math.abs(z - prevZ) / 2.2);
  prevZ = z;

  pathAt(z, camPos);
  pathAt(z - 34, aheadPos);
  look.x += (lookTarget.x - look.x) * 0.05;
  look.y += (lookTarget.y - look.y) * 0.05;

  camera.position.copy(camPos);
  aheadPos.x += look.x * 26;                    // the cursor actually steers the camera
  aheadPos.y -= look.y * 16;
  camera.lookAt(aheadPos);

  // the page shatters because the camera reached it, not because a timeline said so
  const morph = Math.min(1, Math.max(0, (28 - z) / 46));
  if (pointsMat) {
    pointsMat.uniforms.uTime.value = t;
    pointsMat.uniforms.uMorph.value = morph;
    pointsMat.uniforms.uCam.value.copy(camPos);
  }
  if (pagePlane) {
    pagePlane.material.uniforms.uTime.value = t;
    pagePlane.material.uniforms.uErode.value = morph;
    pagePlane.visible = morph < 0.80;          // fully eroded past this point
  }

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  postMat.uniforms.uTime.value = t;
  postMat.uniforms.uSpeed.value = speed;
  postMat.uniforms.uShatter.value = Math.exp(-Math.pow((morph - 0.38) / 0.22, 2));
  renderer.render(postScene, postCam);

  readout.textContent = 'z ' + z.toFixed(0);
  placeEl.textContent = placeName(z);
  hint.style.opacity = smoothP > 0.02 ? '0' : '1';
}

/* ============================================================================
   BOOT
   ========================================================================== */
const loadImage = (src) => new Promise((res, rej) => new THREE.ImageLoader().load(src, res, undefined, rej));

(async function boot() {
  const loading = document.getElementById('loading');
  try {
    const [portraitImg, ...projImgs] = await Promise.all([
      loadImage(PORTRAIT_SRC), ...PROJECTS.map(p => loadImage(p.src)),
    ]);

    const textures = {};
    PROJECTS.forEach((p, n) => {
      const tex = new THREE.Texture(projImgs[n]);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      textures[p.src] = tex;
    });

    buildPage(portraitImg);
    buildProjects(textures);
    buildDiff();
    buildEnd();

    await new Promise((res) => {
      setTimeout(res, 3000);
      preloadFont({ characters: 'Preserved, not inflated.LIEL BEN-ORThings I built.Same person Different definition of done Let’s build something liel4349@gmail.com GITHUBLINKEDINRESUME−+' }, res);
    });

    resize();
    loading.classList.add('done');
    frame();
  } catch (err) {
    loading.textContent = 'failed: ' + (err && err.message ? err.message : err);
  }
})();
</script>
